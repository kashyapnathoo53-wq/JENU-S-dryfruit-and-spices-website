<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Deep Kashmir Velvet Obsidian-Pine Gradient -->
    <radialGradient id="kashmirPineBg" cx="50%" cy="26%" r="75%">
      <stop offset="0%" stop-color="#164A38"/>
      <stop offset="55%" stop-color="#092419"/>
      <stop offset="100%" stop-color="#010D06"/>
    </radialGradient>
    
    <!-- 24K Royal Kashmir Gold Gradient with Pure Specular Highlight -->
    <linearGradient id="royalChinarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#FDE047"/>
      <stop offset="48%" stop-color="#EAB308"/>
      <stop offset="78%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Beveled Light Reflection for Frame -->
    <linearGradient id="bevelLightRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#EAB308" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#713F12" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Minted Emboss Drop Shadow -->
    <filter id="chinarMintShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 1. Luxury Squircle Base Plate -->
  <rect width="128" height="128" rx="28" fill="url(#kashmirPineBg)"/>

  <!-- 2. Dual Luxury Framing (Outer 24K Gold Rim + Inner Bevel Hairline) -->
  <rect x="5.5" y="5.5" width="117" height="117" rx="23" fill="none" stroke="url(#royalChinarGold)" stroke-width="2.2"/>
  <rect x="9.5" y="9.5" width="109" height="109" rx="19.5" fill="none" stroke="url(#bevelLightRim)" stroke-width="0.8"/>

  <!-- 3. Heraldic Master Kashmiri Chinar (Boonyi) Leaf -->
  <g filter="url(#chinarMintShadow)">
    <path d="
      M 64,16
      C 66.5,23 71.5,26.5 75,25
      C 73,29 71,32 72.5,33.5
      C 77,33.5 84,31.5 89.5,28.5
      C 86,34 84.5,38 88.5,40.5
      C 93.5,39 99,39.5 102,40
      C 97.5,45 92.5,48.5 94.5,52.5
      C 97,55.5 100,58 97,61.5
      C 92,62 85,60 81.5,62.5
      C 79,64.5 78.5,68 82,71
      C 84.5,73 85,76 81.5,78
      C 76.5,78 72,74 68.5,76.5
      C 66.5,78 66,81 66,85
      L 66,107
      C 66,108.5 64.5,109.5 64,109.5
      C 63.5,109.5 62,108.5 62,107
      L 62,85
      C 62,81 61.5,78 59.5,76.5
      C 56,74 51.5,78 46.5,78
      C 43,76 43.5,73 46,71
      C 49.5,68 49,64.5 46.5,62.5
      C 43,60 36,62 31,61.5
      C 28,58 31,55.5 33.5,52.5
      C 35.5,48.5 30.5,45 26,40
      C 29,39.5 34.5,39 39.5,40.5
      C 43.5,38 42,34 38.5,28.5
      C 44,31.5 51,33.5 55.5,33.5
      C 57,32 55,29 53,25
      C 56.5,26.5 61.5,23 64,16
      Z
    " fill="url(#royalChinarGold)"/>

    <!-- Sculpted Inner Relief Veins -->
    <path d="
      M 64,22 L 64,84
      M 64,42 C 72,36 82,32 90,30
      M 64,42 C 56,36 46,32 38,30
      M 64,56 C 74,51 84,48 94,44
      M 64,56 C 54,51 44,48 34,44
      M 64,68 C 72,64 78,63 84,62
      M 64,68 C 56,64 50,63 44,62
    " fill="none" stroke="#020E06" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>